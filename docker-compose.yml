# chat2api — single service, one profile volume.
#
# Defaults: the auth-free provider (googleaimode), run headful under Xvfb with the
# live browser exposed over noVNC (:6080) so you can watch/debug — and log in
# immediately if you switch to a login-gated provider (expressai/perplexity). Any
# login session persists to the profile volume, surviving restarts.
#
# Log in to a gated provider (after listing it in CHAT2API_PROVIDERS below):
#   1. docker compose up -d chat2api
#   2. watch for `"authenticated": false` at http://<host>:9000/health
#   3. open http://<host>:6080/vnc.html, click Connect, log in in the browser
#      (open a new tab there if the server is live and serving requests)
#   4. /health flips to `"authenticated": true` — done; no restart needed
#
# Leaner auth-free setup: set CHAT2API_HEADLESS=true and drop CHAT2API_VNC and the
# 6080 port (googleaimode needs no display).
#
# Security: noVNC has no password — reach :6080 only over a private network / SSH
# tunnel, never publish it to the internet.

services:
  chat2api:
    image: ghcr.io/madhavtummala/chat2api:latest
    container_name: chat2api
    restart: unless-stopped
    environment:
      # Ordered list of routable providers — the whole routing config. Clients
      # address models as `provider/model`, exactly as GET /v1/models lists them.
      CHAT2API_PROVIDERS: expressai,perplexity
      CHAT2API_HEADLESS: "false"     # headful under Xvfb (required for noVNC)
      CHAT2API_VNC: "true"           # live browser on :6080 for login/debug
      # One tab per provider: a single active user needs no more, and each tab
      # is real Chromium memory on a small host.
      CHAT2API_MAX_CONCURRENCY: "1"
      # Recycle tabs sooner than the default 200 uses; renderer memory creeps up
      # long before then on a Raspberry Pi.
      CHAT2API_MAX_TAB_USES: "50"
    ports:
      - "9000:9000"
      # noVNC has no password, so bind it to loopback and reach it over an SSH /
      # Tailscale tunnel. Anyone who opens this port drives a browser that is
      # logged into your accounts.
      - "127.0.0.1:6080:6080"
    volumes:
      - browser_profile:/app/.browser_profile
    # Without this the server can sit "up" for weeks serving 500s: a browser that
    # cannot be relaunched makes /health return 503, and the restart policy then
    # actually fires. Uses the cheap health path — never `?deep=1`, which would
    # navigate a tab per provider and compete with real traffic.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9000/health').read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # Chromium's first launch is slow on a small host
    # Cap the container so a Chromium leak OOMs *it* and gets restarted, instead
    # of taking the whole host (including sshd) down with it.
    mem_limit: 1500m
    cpus: 3.0

volumes:
  browser_profile:
